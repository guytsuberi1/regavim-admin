  <script>
    // ---- בדיקת גרסה עצמית ----
    // ה-?v=N מונע cache על ה-JS/CSS, אבל index.html עצמו נשמר ב-cache של הדפדפן,
    // ולכן המשתמש ממשיך לטעון את הגרסה הישנה גם אחרי שהפריסה עברה.
    // כאן קוראים את version.json בלי cache ומרעננים פעם אחת אם הגרסה החיה שונה.
    (function () {
      var LOCAL = 130;                       // חייב להיות זהה ל-?v= בכל התגיות למטה
      window.APP_VERSION = LOCAL;
      if (location.protocol === 'file:') return;
      fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || !j.v || j.v === LOCAL) { sessionStorage.removeItem('vreload'); return; }
          if (sessionStorage.getItem('vreload') === String(j.v)) return;  // כבר ניסינו — לא ללולאה
          sessionStorage.setItem('vreload', String(j.v));
          location.reload();
        })
        .catch(function () { /* אין רשת — ממשיכים עם מה שיש */ });
    })();
  </script>

  <style>
    /* תג "ממתינים לאישור" על טאב בתפריט */
    .tab-badge {
      display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 6px;
      border-radius: 9px; background: #dc2626; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    /* קנבן */
    /* קנבן בסגנון Monday: עמודה שקופה, כרטיס לבן נקי, בלי פסי צבע ורקעים צבעוניים */
    .kb-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; }
    .kb-col { flex: 1 1 0; min-width: 250px; background: transparent; border: 0; }
    .kb-head { display: flex; align-items: center; gap: 8px; padding: 6px 4px 10px; font-size: 14px; }
    .kb-hdot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .kb-hname { font-weight: 600; color: var(--text); }
    .kb-count { background: var(--bg); color: var(--muted); border-radius: 999px;
                padding: 1px 8px; font-size: 12px; font-weight: 500; margin-inline-start: auto; }
    .kb-body { min-height: 60px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .kb-body.kb-over { background: rgba(37,99,235,.06); border-radius: 8px; outline: 2px dashed var(--brand); }
    .kb-card {
      background: var(--card, #fff); border: 1px solid var(--border, #d6dce1); border-radius: 8px;
      padding: 12px; cursor: pointer; box-shadow: none; transition: border-color .12s ease, box-shadow .12s ease;
    }
    .kb-card:hover { border-color: var(--brand); box-shadow: 0 4px 6px -4px rgba(0,0,0,.12); }
    .kb-card:active { cursor: grabbing; }
    .kb-title { display: flex; align-items: flex-start; gap: 8px; font-weight: 500; font-size: 14px;
                line-height: 1.4; margin-bottom: 8px; color: var(--text); }
    .kb-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-top: 6px; }
    /* איחור — מסגרת אדומה עדינה בלבד; החיווי המילולי כבר מופיע בצ'יפ */
    .kb-card.kb-late { border-color: #f0a3a3; }
    .kb-card.kb-late:hover { border-color: #dc2626; }
    .kb-drag { opacity: .5; }
    body.dark .kb-count { background: #26323f; }
  </style>

  <script>
    (function () {
      var sb = document.getElementById('sidebar'), tg = document.getElementById('sbToggle');
      var sbClose = document.getElementById('sbClose'), layout = document.querySelector('.layout');
      function mobile() { return window.innerWidth <= 860; }
      function openSb() { if (mobile()) { if (sb) sb.classList.add('open'); } else if (layout) { layout.classList.remove('collapsed'); localStorage.setItem('admin_sidebar_collapsed', '0'); } }
      function closeSb() { if (mobile()) { if (sb) sb.classList.remove('open'); } else if (layout) { layout.classList.add('collapsed'); localStorage.setItem('admin_sidebar_collapsed', '1'); } }
      if (layout && localStorage.getItem('admin_sidebar_collapsed') === '1') layout.classList.add('collapsed');
      if (tg) tg.addEventListener('click', openSb);
      if (sbClose) sbClose.addEventListener('click', closeSb);
      var tabs = document.getElementById('tabs');
      if (tabs && sb) tabs.addEventListener('click', function (e) {
        if (e.target.closest('button') && mobile()) sb.classList.remove('open');
      });
    })();
  </script>
